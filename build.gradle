plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.23'
    id 'com.gradleup.shadow' version '9.0.2'
}
group = 'de.fiden'
version = '3.0.0'
repositories {
    mavenCentral()
    maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
}
dependencies {
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
// Paper >= 1.20.5 laeuft Mojang-gemappt: kein Reobf noetig, das dev-Jar ist das Produktiv-Jar.
paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
processResources {
    inputs.property "version", project.version
    filesMatching("paper-plugin.yml") { expand "version": project.version }
}
